name: tickbell
description: TickBell — invite-only private community for live options trading discussions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing (Navigator 1.0 with a central _AuthGate + named routes table —
  # kept deliberately simple; swap for go_router only if deep-linking needs grow)

  # Backend
  supabase_flutter: ^2.5.6

  # Firebase (FCM only — auth stays on Supabase)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # Google Sign-In (federated into Supabase auth)
  google_sign_in: ^6.2.1

  # Secure storage / device security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.4.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  video_player: ^2.9.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  uuid: ^4.4.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  flutter_dotenv: ^5.1.0
  app_links: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0B0E14"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0B0E14"
    image: assets/images/splash_logo.png
