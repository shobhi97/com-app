workflows:
  tickbell-android-release:
    name: TickBell — Android Release APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        # Create this group in Codemagic UI (Teams > Environment variables)
        # and add: SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_SERVER_CLIENT_ID
        - tickbell_secrets
      android_signing:
        # Upload your release keystore under Codemagic > Code signing identities
        # and reference its name here.
        - tickbell_keystore
      vars:
        PACKAGE_NAME: "com.tickbell.app"
    scripts:
      - name: Set up .env from Codemagic secrets
        script: |
          cat > .env << EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > android/local.properties
      - name: Build release APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID
      - name: Build app bundle (for Play Store)
        script: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/mapping/**/mapping.txt
    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true
